# chi website — build with: hugo --source website
# Served from the apex custom domain (GitHub Pages + Cloudflare DNS); the deploy
# workflow overrides this with `-b` from the Pages URL, so it stays correct even
# before DNS cuts over.
baseURL = "https://getchi.dev/"
locale = "en-us"
title = "getchi (chi) — an autoresearch harness CLI"

disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
enableGitInfo = true

# RSS only where it's useful: the blog section opts in from its own front matter
# (content/blog/_index.md → outputs), so home and docs stay HTML-only.
[outputs]
  home = ["html"]
  section = ["html"]

# Blog listing page size.
[pagination]
  pagerSize = 12

# Google Analytics 4 — getchi.dev property (Happychases account). Hugo's internal
# gtag.js template reads this ID and renders the tag only in production builds
# (`hugo --minify`), never under `hugo server`, so localhost visits aren't tracked.
[services.googleAnalytics]
  ID = "G-9D57Q8BMRX"

[params]
  description = "chi (χ) is an open-source autoresearch harness: point a fleet of coding agents at any problem with a programmatic evaluator and let it improve autonomously until you stop it."
  github = "https://github.com/kdpisda/chi"
  author = "KD"
  author_url = "https://kdpisda.in"
  # current released version — the docs on this site track it. Bump on release
  # and prepend a [[params.versions]] entry pointing older versions at their
  # GitHub release notes (we don't archive per-version doc builds yet).
  version = "0.2.0"

  # Newsletter (Sendy, self-hosted at marketing.happychases.com — same instance
  # as kdpisda.in and jeenotes). OFF while sendyList is empty: the subscribe
  # form isn't rendered and .github/workflows/newsletter.yml skips.
  # sendyList = the `list` value from the Sendy list's *embed form* code — not the
  # hosted-page ?f= token (different encryption; subscribe fails with it).
  # newsletterFrom must be a verified sender for the Sendy brand (Amazon SES).
  sendyUrl = "https://marketing.happychases.com"
  sendyList = "XoEV4oPICDowcTF8m532Xw"
  newsletterFrom = ""

  # "Find chi elsewhere" icon row in the site-wide newsletter block
  # (layouts/partials/newsletter-form.html). Order = display order; `icon` is one
  # of: github, pypi, x, linkedin, youtube, instagram, rss, email.
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/kdpisda/chi"
    icon = "github"
  [[params.social]]
    name = "PyPI"
    url = "https://pypi.org/project/getchi/"
    icon = "pypi"
  [[params.social]]
    name = "X"
    url = "https://x.com/kdpisda"
    icon = "x"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/kdpisda/"
    icon = "linkedin"
  [[params.social]]
    name = "YouTube"
    url = "https://www.youtube.com/@kdpisda"
    icon = "youtube"
  [[params.social]]
    name = "RSS"
    url = "/blog/index.xml"
    icon = "rss"

  [[params.versions]]
    name = "v0.2.0"
    url = "/"
    latest = true
  [[params.versions]]
    name = "v0.1.0"
    url = "https://github.com/kdpisda/chi/releases/tag/v0.1.0"

[menus]
  [[menus.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 10
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 15
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/kdpisda/chi"
    weight = 20

  # Docs sidebar, in reading order.
  [[menus.docs]]
    name = "Getting started"
    pageRef = "/docs/getting-started"
    weight = 10
  [[menus.docs]]
    name = "Concepts"
    pageRef = "/docs/concepts"
    weight = 20
  [[menus.docs]]
    name = "Problems & evaluators"
    pageRef = "/docs/problems"
    weight = 30
  [[menus.docs]]
    name = "Security"
    pageRef = "/docs/security"
    weight = 40
  [[menus.docs]]
    name = "Changelog"
    pageRef = "/docs/changelog"
    weight = 50

[markup]
  [markup.highlight]
    style = "github-dark"     # inline styles; bg #0d1117 matches the site palette
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = false
