{{- /* Date · category · reading time. Context: a blog Page. */ -}}
<p class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
  {{ with .Params.category }}<span class="cat">{{ . }}</span>{{ end }}
  <span>{{ .ReadingTime }} min read</span>
</p>
