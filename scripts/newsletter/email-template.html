<!--
  Newsletter email for a new getchi.dev blog post, filled in by scripts/newsletter/newsletter.py.
  Placeholders (all HTML-escaped; $body_html is the post's newsletter.body as <p>s): $title $date $preheader $post_url $home_url $body_html
  Sendy tags: [Name,fallback=there] personalises; <unsubscribe> is required by Sendy.
  Email clients need inline styles and tables; keep it that way. The body stays
  light (dark-mode clients invert it themselves); the header carries the site's
  dark + phosphor-green look.
-->
<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body style="margin:0;padding:0;background:#f3f5f4;">
<div style="display:none;max-height:0;overflow:hidden;">$preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f4;padding:24px 12px;"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
  <tr><td style="background:#0a0d12;padding:18px 28px;font-family:Menlo,Consolas,'Courier New',monospace;">
    <a href="$home_url" style="color:#d7dde6;font-size:16px;font-weight:bold;text-decoration:none;"><span style="color:#3ddc84;">&chi;</span>&nbsp;chi</a>
    <span style="color:#8b95a3;font-size:13px;margin-left:8px;">// new on the blog</span>
  </td></tr>
  <tr><td style="padding:30px 28px 8px;font-family:Arial,Helvetica,sans-serif;">
    <p style="margin:0 0 18px;font-size:16px;line-height:1.65;color:#1f2937;">Hey [Name,fallback=there],</p>
    <p style="margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">$date</p>
    <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;color:#0f172a;"><a href="$post_url" style="color:#0f172a;text-decoration:none;">$title</a></h1>
    $body_html
  </td></tr>
  <tr><td align="center" style="padding:6px 28px 30px;">
    <a href="$post_url" style="display:inline-block;background:#3ddc84;color:#06130c;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;text-decoration:none;padding:14px 34px;border-radius:10px;">Read the post &rarr;</a>
  </td></tr>
  <tr><td style="padding:18px 28px;border-top:1px solid #e2e8f0;font-family:Arial,sans-serif;font-size:12px;line-height:1.6;color:#94a3b8;">
    You're getting this because you subscribed on <a href="$home_url" style="color:#64748b;">getchi.dev</a>. Reply any time &mdash; it reaches a human.<br>
    <unsubscribe style="color:#64748b;">Unsubscribe</unsubscribe>
  </td></tr>
</table>
</td></tr></table>
</body></html>
