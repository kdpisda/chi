name: optimize_function
description: >
  Minimize the runtime of solve(xs) -> prefix sums of xs. Output must match
  reference.py within tolerance on all held-out seeds. Any pure-Python or
  stdlib approach is allowed; the shipped baseline is intentionally O(n^2).
candidate: candidate.py
entrypoints:
  correctness: "{python} check.py {candidate} --seed {seed}"
  benchmark: "{python} bench.py {candidate}"
score:
  metric: runtime_ms
  direction: minimize
  repeats: 5
correctness:
  seeds: [11, 27, 43]
  tolerance: 1.0e-6
# Held-out scoring. bench.py times one fixed 4000-element input, so that input is
# what the fleet's selection pressure points at. holdout_bench.py scores three
# other sizes under a different seed and never enters an agent workdir, so chi
# can tell a real speedup from one shaped around the benchmark.
holdout:
  benchmark: "{python} holdout_bench.py {candidate}"
  files: [holdout_bench.py]
  repeats: 3
  min_generalization: 0.5
  # above this workload's own run-to-run noise (~2.5% on the O(n^2) baseline),
  # so a flat held-out result reads as "didn't transfer", not "got slower"
  max_regression_pct: 5.0
timeout_seconds: 60
