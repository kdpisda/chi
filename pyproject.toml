[project]
name = "getchi"
dynamic = ["version"]  # single-sourced from chi/__init__.py:__version__
description = "Chi (χ) — an open-source autoresearch harness CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  # <1.92: newer releases are sdist-only with a Rust build step; 1.91.x ships wheels
  "litellm>=1.40,<1.92",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "inquirerpy>=0.3",
  "textual>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
chi = "chi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "chi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["chi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
