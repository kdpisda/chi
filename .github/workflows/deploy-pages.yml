name: deploy-pages

# Build the Hugo site in website/ and publish it to GitHub Pages, served on the
# custom apex domain getchi.dev (DNS via Cloudflare; the CNAME file in
# website/static/ ships in the artifact so the domain binding survives deploys).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:  # allow a manual redeploy from the Actions tab

permissions:
  contents: read
  pages: write        # publish to Pages
  id-token: write     # OIDC — deploy-pages verifies the artifact came from this run

# one in-flight deploy at a time; don't cancel a running publish
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"
  # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb (pin + verify: a
  # tampered release asset fails the check before it ever runs)
  HUGO_DEB_SHA256: "8325f3653032d0fc536503691f4833dc4eb6c6be02ee62466758f3f37a7f2fcd"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # full history so Hugo's enableGitInfo can set <lastmod>/dates
      - name: install Hugo (extended, pinned + checksum-verified)
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSLf -o "$deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          echo "${HUGO_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"
      - name: build site
        # baseURL comes from hugo.toml (https://getchi.dev/) — the site is served
        # from the apex custom domain, so assets/links must resolve at root. Do NOT
        # override with the Pages default URL (…github.io/chi/): that /chi/ subpath
        # 404s every asset on getchi.dev.
        run: hugo --source website --minify
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
        id: deployment
