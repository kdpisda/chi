name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (tag hijack can't move a SHA); the trailing
      # comment records the tag each SHA froze
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      # lockfile must be in sync with pyproject — a drifted lock is a supply-chain risk
      - name: verify lockfile is current
        run: uv lock --locked
      - name: install
        run: uv sync --extra dev
      - name: test
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: "3.12"
      - name: install pip-audit
        run: uv tool install pip-audit
      # fail on known vulnerabilities in resolved dependencies
      - name: audit dependencies
        run: uv export --format requirements-txt --no-emit-project | uv tool run pip-audit -r /dev/stdin
